name: Sync AsyncTI4 data

on:
  schedule:
    - cron:   '0 */12 * * *'   # every 12h UTC
  workflow_dispatch:

jobs:
  sync-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Set up Git config
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Clone source repo
        run: |
          git clone --depth 1 https://github.com/AsyncTI4/TI4_map_generator_bot temp-bot-repo

      - name: Copy systems, planets, tokens, attachments, images, and properties files
        run: |
          # Clean sync - remove existing and copy fresh
          rm -rf public/data/systems public/data/planets public/data/tiles public/data/tokens public/data/attachments public/data/hyperlanes.properties public/data/tokens.properties public/attachment_token public/tokens
          mkdir -p public/data/systems public/data/planets public/data public/data/tiles public/data/tokens public/data/attachments public/attachment_token public/tokens
          cp temp-bot-repo/src/main/resources/systems/*.json public/data/systems/
          cp temp-bot-repo/src/main/resources/planets/*.json public/data/planets/
          # Copy tokens if they exist
          if ls temp-bot-repo/src/main/resources/data/tokens/*.json 1> /dev/null 2>&1; then
            cp temp-bot-repo/src/main/resources/data/tokens/*.json public/data/tokens/
            echo "Copied tokens from data/tokens directory"
          else
            echo "No JSON files found in data/tokens directory"
          fi
          cp temp-bot-repo/src/main/resources/data/attachments/*.json public/data/attachments/
          cp temp-bot-repo/src/main/resources/tiles/*.png public/data/tiles/
          cp temp-bot-repo/src/main/resources/data/hyperlanes.properties public/data/hyperlanes.properties
          # Copy tokens.properties
          if [ -f temp-bot-repo/src/main/resources/data/tokens.properties ]; then
            cp temp-bot-repo/src/main/resources/data/tokens.properties public/data/tokens.properties
            echo "Copied tokens.properties"
          else
            echo "tokens.properties not found"
          fi
          # Copy token images
          if [ -d temp-bot-repo/src/main/resources/attachment_token ]; then
            cp -r temp-bot-repo/src/main/resources/attachment_token/* public/attachment_token/
            echo "Copied attachment token images"
          else
            echo "attachment_token directory not found"
          fi
          if [ -d temp-bot-repo/src/main/resources/tokens ]; then
            cp -r temp-bot-repo/src/main/resources/tokens/* public/tokens/
            echo "Copied token images"
          else
            echo "tokens directory not found"
          fi

      # --- Eronous exclusion (requested by tile maker, remove this block to re-enable) ---
      # Deletes only source:"eronous" system/planet files and their tile art before the
      # bundle step runs, so Eronous tiles never reach SystemInfo.json or the app.
      # Somno (source: somno) and Lost Star Charts of Ixth (source: lost_star_charts_of_ixth)
      # are a different source and are intentionally left untouched.
      # Note: this workflow pushes to ${{ github.ref_name }}, so on a schedule it only
      # takes effect once this step is merged into the default branch.
      #
      # RE-ENABLING ERONOUS: deleting this block is not enough. Also delete the
      # "Verify Eronous tiles were excluded" step below, or every run fails once the
      # tiles come back; drop `hidden: true` from the `eron` entry of SOURCE_GROUPS in
      # src/modules/SystemPicker/pickerModel.js to restore its button; and fix up the
      # `sources={eron} is empty` check in tools/test-automapper.js, which is the
      # tripwire that will tell you the data has returned.
      - name: Exclude Eronous tiles
        run: |
          python3 - << 'EOF'
          import json, glob, os

          EXCLUDED_SOURCE = 'eronous'

          def load(path):
              with open(path, encoding='utf-8') as f:
                  return json.load(f)

          # Pass 1: split systems into excluded / kept, and note which planet ids and
          # tile images each side claims.
          excluded_paths, excluded_planet_ids, kept_planet_ids, kept_images = [], set(), set(), set()
          for path in glob.glob('public/data/systems/*.json'):
              sys = load(path)
              excluded = sys.get('source') == EXCLUDED_SOURCE
              target = excluded_planet_ids if excluded else kept_planet_ids
              for pid in sys.get('planets', []) or []:
                  if pid:
                      target.add(pid)
              if excluded:
                  excluded_paths.append((path, sys.get('imagePath')))
              elif sys.get('imagePath'):
                  kept_images.add(sys['imagePath'].lower())

          # Pass 2: remove the systems and their tile art.
          for path, image_path in excluded_paths:
              if image_path:
                  tile_path = os.path.join('public/data/tiles', image_path)
                  if os.path.exists(tile_path):
                      os.remove(tile_path)
              os.remove(path)

          # Pass 3: only delete planets no surviving system still references, otherwise the
          # bundle step would silently drop that planet from the system that kept it.
          shared = sorted(excluded_planet_ids & kept_planet_ids)
          removed_planets = 0
          for pid in sorted(excluded_planet_ids - kept_planet_ids):
              planet_path = os.path.join('public/data/planets', f'{pid}.json')
              if os.path.exists(planet_path):
                  os.remove(planet_path)
                  removed_planets += 1

          # Pass 4: sweep up er_*.png that no system references at all — upstream ships a
          # few of those, and they are Eronous art too. Anything a surviving system still
          # points at is left alone, so this cannot delete art that is in use.
          removed_orphans = 0
          for tile_path in glob.glob('public/data/tiles/er_*'):
              if os.path.basename(tile_path).lower() in kept_images:
                  continue
              os.remove(tile_path)
              removed_orphans += 1

          print(f'Excluded {len(excluded_paths)} Eronous systems and {removed_planets} Eronous planets')
          print(f'Removed {removed_orphans} unreferenced er_* tile image(s)')
          if shared:
              print(f'Kept {len(shared)} planet(s) also used by non-Eronous systems: {", ".join(shared)}')
          EOF
      # --- end Eronous exclusion ---

      - name: Combine into a single bundle
        run: |
          python3 - << 'EOF'
          import json, glob, os

          # encoding is explicit throughout: without it Python uses the platform
          # default, which mangles the non-ASCII characters in the legendary
          # ability text anywhere the default is not UTF-8.
          def load(path):
            with open(path, encoding='utf-8') as f:
              return json.load(f)

          # Load all planets into a dict by id
          planets = {}
          for path in sorted(glob.glob('public/data/planets/*.json')):
            p = load(path)
            planets[p['id']] = p

          # For each system, load it and replace its 'planets' list of IDs
          # with a list of full planet objects.
          systems = []
          for path in sorted(glob.glob('public/data/systems/*.json')):
            sys = load(path)
            # sys['planets'] is currently a list of planet IDs (or empty/null entries)
            planet_objs = []
            for pid in sys.get('planets', []):
              if pid and pid in planets:
                planet_objs.append(planets[pid])
            sys['planets'] = planet_objs
            systems.append(sys)

          # Write the combined bundle
          bundle = { 'systems': systems }
          os.makedirs('public/data', exist_ok=True)
          with open('public/data/SystemInfo.json', 'w', encoding='utf-8') as out:
            json.dump(bundle, out, separators=(',',':'))

          EOF

      # Catches the case where upstream renames the "eronous" source value: the
      # exclusion step above would then quietly match nothing and the tiles would
      # return. The source histogram makes such a rename visible in the log.
      - name: Verify Eronous tiles were excluded
        run: |
          python3 - << 'EOF'
          import collections, json, sys

          with open('public/data/SystemInfo.json', encoding='utf-8') as f:
              systems = json.load(f)['systems']

          counts = collections.Counter(s.get('source') or '(none)' for s in systems)
          print(f'{len(systems)} systems by source:')
          for source, n in sorted(counts.items()):
              print(f'  {source}: {n}')

          # Substring match, so an upstream rename like "eronous_tiles" trips this too.
          leaked = [s['id'] for s in systems if 'eronous' in (s.get('source') or '').lower()]
          if leaked:
              sources = sorted({s.get('source') for s in systems if 'eronous' in (s.get('source') or '').lower()})
              print(f'::error::{len(leaked)} Eronous systems (source: {", ".join(sources)}) reached '
                    f'SystemInfo.json: {", ".join(leaked[:20])}')
              sys.exit(1)
          EOF

      - name: Combine tokens into tokens.json
        run: |
          python3 - << 'EOF'
          import json, glob, os

          # Load all tokens into a list
          tokens = []
          token_files = glob.glob('public/data/tokens/*.json')
          print(f"Found {len(token_files)} token JSON files")
          
          for path in sorted(token_files):
            print(f"Processing token file: {path}")
            try:
              token = json.load(open(path))
              tokens.append(token)
            except Exception as e:
              print(f"Error loading {path}: {e}")

          print(f"Combined {len(tokens)} tokens")
          
          # Write the combined tokens bundle
          os.makedirs('public/data', exist_ok=True)
          with open('public/data/tokens.json', 'w') as out:
            json.dump(tokens, out, separators=(',',':'))
            
          EOF

      - name: Combine attachments into attachments.json
        run: |
          python3 - << 'EOF'
          import json, glob, os

          # Load all attachments into a list
          attachments = []
          for path in sorted(glob.glob('public/data/attachments/*.json')):
            attachment = json.load(open(path))
            attachments.append(attachment)

          # Write the combined attachments bundle
          os.makedirs('public/data', exist_ok=True)
          with open('public/data/attachments.json', 'w') as out:
            json.dump(attachments, out, separators=(',',':'))
            
          EOF

      - name: Generate border.json from BorderAnomalyModel.java
        run: |
          python3 - << 'EOF'
          import json, os, re

          # Read and parse BorderAnomalyModel.java
          border_anomalies = []
          
          with open('temp-bot-repo/src/main/java/ti4/model/BorderAnomalyModel.java', 'r', encoding='utf-8') as f:
              content = f.read()
          
          # Find the enum section
          enum_pattern = r'public enum BorderAnomalyType\s*\{(.*?)\}'
          enum_match = re.search(enum_pattern, content, re.DOTALL)
          
          if enum_match:
              enum_content = enum_match.group(1)
              
              # Parse each enum entry - pattern: ENUM_NAME("Display Name", "image.png")
              entry_pattern = r'(\w+)\("([^"]+)",\s*"([^"]+)"\)'
              entries = re.findall(entry_pattern, enum_content)
              
              for enum_name, display_name, image_file in entries:
                  # Generate ID from first word of enum name (remove underscores)
                  id_parts = enum_name.split('_')
                  if len(id_parts) > 1:
                      # For multi-word enums like GRAVITY_WAVE, use both words
                      border_id = ''.join(id_parts)
                  else:
                      border_id = enum_name
                  
                  # Generate aliases
                  aliases = [enum_name.lower()]
                  if '_' in enum_name:
                      aliases.append(enum_name.lower().replace('_', ''))
                      aliases.extend(part.lower() for part in enum_name.split('_'))
                  
                  # Add display name variations as aliases
                  display_lower = display_name.lower()
                  if display_lower not in aliases:
                      aliases.append(display_lower)
                  
                  # Add space-separated words from display name
                  display_words = display_lower.replace(' ', '_').split('_')
                  for word in display_words:
                      if word and word not in aliases:
                          aliases.append(word)
                  
                  border_anomalies.append({
                      "id": border_id,
                      "name": display_name,
                      "alias": list(set(aliases)),  # Remove duplicates
                      "image": image_file
                  })
          
          # Write the border anomalies data
          os.makedirs('public/data', exist_ok=True)
          with open('public/data/border.json', 'w') as out:
              json.dump(border_anomalies, out, separators=(',',':'))
              
          EOF

      - name: Convert hyperlanes.properties to compact hyperlanes.json
        run: |
          python3 - << 'EOF'
          import json
          props = {}
          with open('public/data/hyperlanes.properties', encoding='utf-8') as f:
              for line in f:
                  line = line.strip()
                  if not line or line.startswith('#'): continue
                  if '=' in line:
                      k, v = line.split('=', 1)
                      matrix = [
                          [int(x) for x in row.split(',')]
                          for row in v.strip().split(';') if row
                      ]
                      props[k.strip()] = matrix
          with open('public/data/hyperlanes.json', 'w', encoding='utf-8') as out:
              json.dump(props, out, separators=(',', ':'), ensure_ascii=False)
          EOF

      - name: Build loreData.json (techs, factions, colors, unit aliases for the Lore module)
        run: |
          python3 - << 'EOF'
          import json, glob, os

          # Source: the read-only clone of AsyncTI4/TI4_map_generator_bot.
          BOT = os.environ.get('BOT_REPO', 'temp-bot-repo')
          OUT = os.environ.get('OUT_DIR', 'public/data')
          RES = os.path.join(BOT, 'src/main/resources')

          def load_all(pattern):
              out = []
              for path in sorted(glob.glob(os.path.join(RES, pattern))):
                  try:
                      data = json.load(open(path, encoding='utf-8'))
                      out.extend(data if isinstance(data, list) else [data])
                  except Exception as e:
                      print(f'skipping {path}: {e}')
              return out

          def load_properties(rel):
              props = {}
              path = os.path.join(RES, rel)
              if not os.path.exists(path):
                  print(f'missing {path}')
                  return props
              for line in open(path, encoding='utf-8'):
                  line = line.strip()
                  if not line or line.startswith('#') or '=' not in line:
                      continue
                  k, v = line.split('=', 1)
                  props[k.strip()] = v.strip()
              return props

          # Techs: the JSON "alias" field IS the tech id the lore engine resolves.
          techs, seen = [], set()
          for t in load_all('data/technologies/*.json'):
              tid = t.get('alias')
              if not tid or tid in seen:
                  continue
              seen.add(tid)
              tech = {'id': tid, 'name': t.get('name', tid), 'types': t.get('types', []), 'source': t.get('source', '')}
              if t.get('faction'):
                  tech['faction'] = t['faction']
              techs.append(tech)

          # tech_alias.properties: id = comma-separated display names -> reverse to name->id
          tech_aliases = {}
          for tid, names in load_properties('alias/tech_alias.properties').items():
              for name in names.split(','):
                  name = name.strip().lower()
                  if name and name not in tech_aliases:
                      tech_aliases[name] = tid

          factions, seen = [], set()
          for f in load_all('data/factions/*.json'):
              fid = f.get('alias')
              if not fid or fid in seen:
                  continue
              seen.add(fid)
              factions.append({'id': fid, 'name': f.get('factionName', fid), 'source': f.get('source', '')})

          colors, seen = [], set()
          for c in load_all('data/colors/*.json'):
              cid = c.get('alias')
              name = c.get('name', cid)
              if not name or name in seen:
                  continue
              seen.add(name)
              aliases = sorted({a.lower() for a in ([cid] + c.get('aliases', [])) if a})
              colors.append({'id': cid, 'name': name, 'display': c.get('displayName', name), 'aliases': aliases})

          # unit_alias.properties: canonical code = comma-separated accepted spellings
          unit_aliases = {}
          for code, names in load_properties('alias/unit_alias.properties').items():
              unit_aliases[code] = sorted({n.strip().lower() for n in names.split(',') if n.strip()})

          bundle = {
              'techs': sorted(techs, key=lambda t: (t['source'], t['name'])),
              'techAliases': tech_aliases,
              'factions': sorted(factions, key=lambda f: (f['source'], f['name'])),
              'colors': sorted(colors, key=lambda c: c['name']),
              'unitAliases': unit_aliases,
          }
          os.makedirs(OUT, exist_ok=True)
          with open(os.path.join(OUT, 'loreData.json'), 'w', encoding='utf-8') as out:
              json.dump(bundle, out, separators=(',', ':'), ensure_ascii=False)
          print(f'loreData.json: {len(techs)} techs, {len(tech_aliases)} tech aliases, '
                f'{len(factions)} factions, {len(colors)} colors, {len(unit_aliases)} unit codes')
          EOF

      - name: Build tokenSemantics.json (effects, card text, bot-code references)
        run: |
          python3 - << 'EOF'
          import json, glob, os, re

          # Source: the read-only clone of AsyncTI4/TI4_map_generator_bot.
          BOT = os.environ.get('BOT_REPO', 'temp-bot-repo')
          OUT = os.environ.get('OUT_DIR', 'public/data')
          RES = os.path.join(BOT, 'src/main/resources')
          JAVA = os.path.join(BOT, 'src/main/java')

          # Fields that carry gameplay meaning. Everything else (imagePath, placement,
          # scale, aliasList, source) is presentation or provenance, so a token/attachment
          # carrying none of these is "bare bones" as far as the synced data can tell.
          TOKEN_SEMANTIC_KEYS = ('wormholes', 'isAnomaly', 'isRift', 'isNebula', 'isNova',
                                 'isScar', 'isAsteroids', 'isPlanet', 'tokenPlanetName', 'attachmentID')
          ATTACH_SEMANTIC_KEYS = ('resourcesModifier', 'influenceModifier', 'techSpeciality',
                                  'planetTypes', 'isLegendary', 'spaceCannonHitsOn',
                                  'spaceCannonDieCount', 'token', 'isFakeAttachment')

          # Ids shorter than this collide with unrelated Java string literals ("ul", "ds"),
          # so they are reported as not-measured rather than with a number we cannot trust.
          MIN_SCAN_ID_LEN = 4


          def load_all(pattern):
              out = []
              for path in sorted(glob.glob(os.path.join(RES, pattern))):
                  try:
                      data = json.load(open(path, encoding='utf-8'))
                      out.extend(data if isinstance(data, list) else [data])
                  except Exception as e:
                      print(f'skipping {path}: {e}')
              return out


          def load_bundle(name):
              """tokens.json / attachments.json are arrays of arrays (one per source file)."""
              path = os.path.join(OUT, name)
              try:
                  data = json.load(open(path, encoding='utf-8'))
              except Exception as e:
                  print(f'skipping {path}: {e}')
                  return []
              out = []
              for group in data:
                  out.extend(group if isinstance(group, list) else [group])
              return out


          def pretty(text):
              text = re.sub(r'^token_', '', str(text or ''))
              words = [w for w in re.split(r'[_\s]+', text) if w]
              return ' '.join('DMZ' if w.lower() == 'dmz' else w[:1].upper() + w[1:] for w in words)


          def pretty_wormhole(hole):
              """Wormhole ids are SHOUTED (ALPHA, CUSTOM_ERONOUS_WHIOTA); title-case them."""
              text = re.sub(r'^CUSTOM_', '', str(hole or ''))
              return ' '.join(w.capitalize() for w in re.split(r'[_\s]+', text) if w)


          def norm_name(text):
              return re.sub(r'[^a-z0-9]', '', str(text or '').lower())


          def signed(n):
              return f'+{n}' if n > 0 else str(n)


          # ── Prose sources ────────────────────────────────────────────────────────────
          # ExploreModel is the only model with an attachmentId, so explore cards are the
          # authoritative join. Relics and agendas carry text but no link, so they are
          # matched on normalised name and only used as a fallback.
          explore_by_attachment = {}
          for card in load_all('data/explores/*.json'):
              att_id = card.get('attachmentId')
              if att_id and att_id not in explore_by_attachment:
                  explore_by_attachment[att_id] = card

          prose_by_name = {}
          for kind, pattern, id_key in (('relic', 'data/relics/*.json', 'alias'),
                                        ('agenda', 'data/agendas/*.json', 'alias')):
              for card in load_all(pattern):
                  key = norm_name(card.get('name'))
                  text = card.get('text') or card.get('text1')
                  if key and text and key not in prose_by_name:
                      prose_by_name[key] = (f"{kind}:{card.get(id_key) or key}", text)


          def find_prose(entry_id, name):
              card = explore_by_attachment.get(entry_id)
              if card and card.get('text'):
                  return f"explore:{card.get('id') or entry_id}", card['text'], card.get('name')
              hit = prose_by_name.get(norm_name(name))
              if hit:
                  return hit[0], hit[1], None
              return None, None, None


          # ── Bot source scan ──────────────────────────────────────────────────────────
          # Counts each id as an exact quoted Java string literal. This proves the id is
          # REFERENCED in bot code; it is not proof the effect is automated. Short ids are
          # skipped because they collide with unrelated literals.
          def scan_java_literals():
              hits = {}
              literal_re = re.compile(r'"([^"\\\n]*)"')
              for root, _dirs, files in os.walk(JAVA):
                  for fname in sorted(files):
                      if not fname.endswith('.java'):
                          continue
                      path = os.path.join(root, fname)
                      try:
                          body = open(path, encoding='utf-8', errors='replace').read()
                      except Exception as e:
                          print(f'skipping {path}: {e}')
                          continue
                      rel = os.path.relpath(path, JAVA).replace(os.sep, '/')
                      for literal in literal_re.findall(body):
                          if len(literal) < MIN_SCAN_ID_LEN:
                              continue
                          bucket = hits.setdefault(literal, {'count': 0, 'files': set()})
                          bucket['count'] += 1
                          bucket['files'].add(rel)
              return hits


          java_hits = scan_java_literals() if os.path.isdir(JAVA) else {}
          if not java_hits:
              print(f'WARNING: no Java sources scanned under {JAVA}; botCodeRefs will be null')


          def bot_code_refs(entry_id):
              if not java_hits or len(entry_id) < MIN_SCAN_ID_LEN:
                  return {'count': None, 'files': []}
              hit = java_hits.get(entry_id)
              if not hit:
                  return {'count': 0, 'files': []}
              return {'count': hit['count'], 'files': sorted(hit['files'])[:5]}


          # ── Effect derivation ────────────────────────────────────────────────────────
          def attachment_effects(att):
              effects = []
              res, inf = att.get('resourcesModifier'), att.get('influenceModifier')
              if isinstance(res, int) and res != 0:
                  effects.append(f'{signed(res)} resources')
              if isinstance(inf, int) and inf != 0:
                  effects.append(f'{signed(inf)} influence')
              if att.get('techSpeciality'):
                  effects.append('Tech: ' + ', '.join(att['techSpeciality']))
              if att.get('planetTypes'):
                  effects.append('Planet type: ' + ', '.join(att['planetTypes']))
              if att.get('isLegendary'):
                  effects.append('Legendary')
              if att.get('spaceCannonHitsOn'):
                  dice = att.get('spaceCannonDieCount') or 1
                  effects.append(f"Space cannon {att['spaceCannonHitsOn']}" + (f' (x{dice})' if dice > 1 else ''))
              if att.get('token'):
                  effects.append(f"Places token {att['token']}")
              if att.get('isFakeAttachment'):
                  effects.append('Fake attachment')
              return effects


          def token_effects(tok):
              effects = []
              for hole in tok.get('wormholes') or []:
                  effects.append(f'{pretty_wormhole(hole)} wormhole')
              if tok.get('isAnomaly'):
                  effects.append('Anomaly')
              if tok.get('isRift'):
                  effects.append('Gravity rift')
              if tok.get('isNebula'):
                  effects.append('Nebula')
              if tok.get('isNova'):
                  effects.append('Supernova')
              if tok.get('isScar'):
                  effects.append('Scar')
              if tok.get('isAsteroids'):
                  effects.append('Asteroid field')
              if tok.get('tokenPlanetName'):
                  effects.append(f"Creates planet: {tok['tokenPlanetName']}")
              elif tok.get('isPlanet'):
                  effects.append('Adds a planet')
              if tok.get('attachmentID'):
                  effects.append(f"Attaches {tok['attachmentID']}")
              return effects


          # ── Build ────────────────────────────────────────────────────────────────────
          attachments_out, attachment_names = {}, {}
          for att in load_bundle('attachments.json'):
              att_id = att.get('id')
              if not att_id or att_id in attachments_out:
                  continue
              text_source, text, card_name = find_prose(att_id, att.get('name'))
              display = card_name or att.get('name') or pretty(att_id)
              attachment_names[att_id] = display
              attachments_out[att_id] = {
                  'displayName': display,
                  'kind': 'attachment',
                  'source': att.get('source', ''),
                  'effects': attachment_effects(att),
                  'text': text,
                  'textSource': text_source,
                  'botCodeRefs': bot_code_refs(att_id),
                  'hasData': any(k in att for k in ATTACH_SEMANTIC_KEYS),
              }

          tokens_out = {}
          for tok in load_bundle('tokens.json'):
              tok_id = tok.get('id')
              if not tok_id or tok_id in tokens_out:
                  continue
              linked = tok.get('attachmentID')
              text_source, text, card_name = find_prose(linked or tok_id, None)
              if linked and linked in attachment_names:
                  display = attachment_names[linked]
              elif card_name:
                  display = card_name
              elif tok.get('tokenPlanetName'):
                  display = pretty(tok['tokenPlanetName'])
              elif tok.get('wormholes'):
                  display = pretty_wormhole(tok['wormholes'][0]) + ' Wormhole'
              else:
                  display = pretty(tok_id)
              tokens_out[tok_id] = {
                  'displayName': display,
                  'kind': 'token',
                  'source': tok.get('source', ''),
                  'spaceOrPlanet': tok.get('spaceOrPlanet', ''),
                  'effects': token_effects(tok),
                  'text': text,
                  'textSource': text_source,
                  'botCodeRefs': bot_code_refs(tok_id),
                  'hasData': any(k in tok for k in TOKEN_SEMANTIC_KEYS),
              }

          bundle = {
              'tokens': {k: tokens_out[k] for k in sorted(tokens_out)},
              'attachments': {k: attachments_out[k] for k in sorted(attachments_out)},
          }
          os.makedirs(OUT, exist_ok=True)
          with open(os.path.join(OUT, 'tokenSemantics.json'), 'w', encoding='utf-8') as out:
              json.dump(bundle, out, separators=(',', ':'), ensure_ascii=False)

          scanned = sum(1 for e in list(tokens_out.values()) + list(attachments_out.values())
                        if (e['botCodeRefs']['count'] or 0) > 0)
          prose = sum(1 for e in list(tokens_out.values()) + list(attachments_out.values()) if e['text'])
          print(f'tokenSemantics.json: {len(tokens_out)} tokens, {len(attachments_out)} attachments, '
                f'{prose} with card text, {scanned} referenced in bot code')
          EOF

      - name: Commit & push changes
        run: |
          git add public/data/systems \
                  public/data/planets \
                  public/data/tokens \
                  public/data/attachments \
                  public/data/SystemInfo.json \
                  public/data/tokens.json \
                  public/data/attachments.json \
                  public/data/border.json \
                  public/data/hyperlanes.json \
                  public/data/loreData.json \
                  public/data/tokenSemantics.json \
                  public/data/hyperlanes.properties \
                  public/data/tokens.properties \
                  public/data/tiles \
                  public/attachment_token \
                  public/tokens
          git commit -m "🤖 Sync AsyncTI4 data + build SystemInfo.json, tokens.json, attachments.json, border.json, hyperlanes.json, tokenSemantics.json + token images" \
                     || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git \
                   HEAD:${{ github.ref_name }}
